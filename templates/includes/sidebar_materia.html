{% load extras %}
{% num_actividades_pendientes materia periodo_actual as pendientes_count %}
<div class="nav-divider"></div>

<span style="font-weight:700; color:var(--text); margin-right: 8px; font-size: 15px;" title="{{ materia.grado.nombre }}">{{ materia.nombre }}</span>

<a href="{% url 'asistencia_materia' materia.id %}?periodo={{ periodo_actual }}" class="nav-link {% if modulo_activo == 'asistencia' %}active{% endif %}">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
  Asistencia
</a>
<a href="{% url 'comportamiento_materia' materia.id %}?periodo={{ periodo_actual }}" class="nav-link {% if modulo_activo == 'comportamiento' %}active{% endif %}">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
  Comportamiento
</a>
<a href="{% url 'actividades_materia' materia.id %}?periodo={{ periodo_actual }}" class="nav-link {% if modulo_activo == 'actividades' %}active{% endif %}">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg>
  Actividades
  {% if pendientes_count > 0 %}
  <span style="background:#ef4444; color:#fff; font-size:10px; font-weight:800; padding:2px 6px; border-radius:20px; line-height:1; margin-left:2px; box-shadow: 0 2px 8px rgba(239,68,68,0.4);">{{ pendientes_count }}</span>
  {% endif %}
</a>

<div class="nav-divider"></div>

<div style="display:flex; align-items:center; gap:6px; margin-left: 4px;">
  <span style="font-size: 11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Periodo</span>
  {% for num, label in periodos %}
  <a href="?periodo={{ num }}" class="btn btn-sm {% if num == periodo_actual %}btn-primary{% else %}btn-secondary{% endif %}" style="padding:4px 9px; border-radius:20px; font-size:12px; font-weight: 700; border-color: {% if num != periodo_actual %}rgba(0,0,0,0.06){% else %}transparent{% endif %}; box-shadow: none;" onclick="localStorage.setItem('periodo','{{ num }}')">P{{ num }}</a>
  {% endfor %}
</div>

<script>
// Redirigir al periodo guardado si no hay ?periodo= en la URL
(function(){
  const url = new URL(window.location.href);
  if (!url.searchParams.has('periodo')) {
    const saved = localStorage.getItem('periodo');
    if (saved && saved !== '1') {
      url.searchParams.set('periodo', saved);
      window.location.replace(url.toString());
    }
  }
})();
</script>
